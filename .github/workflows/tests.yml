name: Tests

on:
  push:
    branches: [main, supabase-relay, track-a, registry]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs both packages (webspec + webspec_registry) and their runtime deps.
      - run: pip install ./gateway
      # Test-only tools (not runtime deps of the gateway). PyYAML lets the optional
      # verb-atlas enrichment tests run instead of skip; the gateway degrades
      # gracefully without it.
      - run: pip install pytest pyyaml

      - name: Run gateway + registry test suite
        working-directory: gateway
        run: python -m pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt pytest pyyaml

      # Fails on broken links and anything else MkDocs warns about.
      - run: mkdocs build --strict

      # Rule IDs unique and resolvable, nav complete, docs paths cited in code exist.
      - run: python -m pytest -q docs/tests/test_docs_consistency.py
