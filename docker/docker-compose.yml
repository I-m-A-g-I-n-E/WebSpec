  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #   command: ["python", "-m", "webspec_registry"]
  #   environment:
  #     WEBSPEC_INTERNAL_PORT: "7003"
  #     WEBSPEC_GATEWAY_URL: "http://gateway:7002"
  #   expose:
  #     - "7003"
