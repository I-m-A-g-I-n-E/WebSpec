[project]
name = "webspec-gateway"
version = "0.1.0"
description = "WebSpec local gateway — REST interface to MCP servers via wildcard subdomains"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.35.0",
    "uvicorn>=0.30.0",
    "fastmcp>=2.14.0,<3",
    "mcp>=1.25.0",
]

[project.scripts]
webspec-ctl = "webspec.ctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webspec"]
