services:
  caddy:
    image: caddy:2
    ports:
      - "7001:7001"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
    depends_on: [gateway]

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      WEBSPEC_INTERNAL_PORT: "7002"
      WEBSPEC_HOST: "0.0.0.0"          # inside the compose network, fronted by caddy
      WEBSPEC_CONFIG: "/config/claude.json"
      WEBSPEC_GUARD_KEY: "${WEBSPEC_GUARD_KEY:-}"
      OP_GUARD_KEY_REF: "${OP_GUARD_KEY_REF:-}"
      # Set to activate the public-guard 403 layer (only guarded services are
      # reachable on this domain); leave empty for localhost-only operation.
      WEBSPEC_DOMAIN: "${WEBSPEC_DOMAIN:-}"
    volumes:
      - ${WEBSPEC_CONFIG_HOST:-./claude.json}:/config/claude.json:ro
    expose:
      - "7002"

  # The webspec_registry package IS built — this block is commented out on PURPOSE:
  # the registry is localhost-only by design (exposes the full tool inventory) and has
  # no Caddy route yet, so enabling it here starts a service nothing can reach. For tier
  # B, run it on the host: `python -m webspec_registry` (see README "The registry service").
  # Safe in-stack exposure (guard middleware / Caddy front) is a TODO(C) in docs/ROADMAP-C.md.
