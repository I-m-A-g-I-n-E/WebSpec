site_name: WebSpec
site_description: Every AI tool call as an ordinary HTTP request that says exactly what it does — the HTTP face and firewall in front of MCP servers.
site_url: https://i-m-a-g-i-n-e.github.io/WebSpec/
repo_url: https://github.com/I-m-A-g-I-n-E/WebSpec
repo_name: I-m-A-g-I-n-E/WebSpec
edit_uri: edit/main/docs/

exclude_docs: |
  tests/

# With --strict, any of these fails the build (anchors are only reported by default).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.action.edit
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - attr_list
  - def_list
  - toc:
      permalink: true

nav:
  - Spec:
    - Overview: index.md
    - Addressing: spec/addressing.md
    - Methods and contracts: spec/methods.md
    - Security levels: spec/levels.md
    - Audit and deployment: spec/audit-deployment.md
    - Status and roadmap: spec/status.md
  - Guide:
    - Quickstart: guide/index.md
    - A request at every level: guide/walkthrough.md
    - Annotating MCP servers: guide/annotating.md
    - Human approval: guide/approval.md
    - Threat model and rationale: guide/threat-model.md
