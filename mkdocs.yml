site_name: WebSpec
site_description: An open spec and reference gateway that gives each MCP tool its own URL and each call an HTTP method that says what it does, then refuses the calls whose parts disagree.
site_url: https://i-m-a-g-i-n-e.github.io/WebSpec/
repo_url: https://github.com/I-m-A-g-I-n-E/WebSpec
repo_name: I-m-A-g-I-n-E/WebSpec
edit_uri: edit/main/docs/
copyright: WebSpec, an open specification and reference gateway for MCP.

exclude_docs: |
  tests/

# With --strict, any of these fails the build (anchors are only reported by default).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  font:
    text: Instrument Sans
    code: IBM Plex Mono
  # Colors live in docs/stylesheets/webspec.css: "paper" (light) and "ink" (dark).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

# Rule IDs in docs/spec become linkable anchors (#mb-1).
hooks:
  - overrides/hooks/rule_ids.py

extra_css:
  - stylesheets/webspec.css

extra_javascript:
  - javascripts/webspec.js

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guide:
    - Quickstart: guide/index.md
    - How it works: guide/how-it-works.md
    - A request at every level: guide/walkthrough.md
    - Annotating MCP servers: guide/annotating.md
    - Human approval: guide/approval.md
    - Deploying: guide/deploy.md
    - Threat model: guide/threat-model.md
  - Spec:
    - About this spec: spec/index.md
    - Addressing: spec/addressing.md
    - Methods and contracts: spec/methods.md
    - Security levels: spec/levels.md
    - Audit and deployment: spec/audit-deployment.md
    - Status and roadmap: spec/status.md
